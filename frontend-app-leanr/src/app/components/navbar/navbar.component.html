<div>
    <nav>
        <h3><a routerLink="/log">Code bin</a></h3>
        <ul>
            @if (!api.isLoggedIn()) {
                <li><a routerLink="/login" routerLinkActive="active">Login</a></li>
                <li><a routerLink="/signup" routerLinkActive="active">Signup</a></li>
            } @else {
                <li><a (click)="logout()" routerLinkActive="active">Logout</a></li>
                <li><a routerLink="/create" routerLinkActive="active">Create</a></li>
            }
        </ul>
    </nav>
    <hr>
</div>
